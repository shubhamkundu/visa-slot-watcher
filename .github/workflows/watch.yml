name: Slot watcher

on:
  # schedule paused: checkvisaslots blocks GitHub servers (HTTP 403)
  # schedule:
  #   - cron: "*/5 * * * *" # every 5 min (GitHub may delay runs by a few minutes)
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test push to your phone"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: slot-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check for new sightings
        run: python watch.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CUTOFF_DATE: ${{ vars.CUTOFF_DATE }}
          CITIES: ${{ vars.CITIES }}
          VISA_TYPES: ${{ vars.VISA_TYPES }}
          MAX_AGE_HOURS: ${{ vars.MAX_AGE_HOURS }}
          TEST_ALERT: ${{ inputs.test_alert }}

      - name: Remember what was already alerted
        run: |
          git config user.name "slot-watcher"
          git config user.email "slot-watcher@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update watcher state [skip ci]"
            git pull --rebase --quiet || true
            git push
          fi
